name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: openres-test-only
          POSTGRES_DB: openres_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          OPENRES_TEST_DATABASE_URL: postgres://postgres:openres-test-only@127.0.0.1:5432/openres_test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
